site_name: CheckMAITE
site_url: !ENV [MKDOCS_SITE_URL, "https://openteams-ai.github.io/checkmaite/"]
use_directory_urls: false
theme:
  name: material
  favicon: assets/favicon.ico
  features:
    - navigation.sections
    - navigation.tabs
    - navigation.indexes
    - toc.integrate
  palette:
    # Palette toggle for light mode
    - scheme: default
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
      primary: black
      accent: indigo

    # Palette toggle for dark mode
    - scheme: slate
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
      primary: black
      accent: indigo

nav:  # navigation links on sidebar
  - Home: index.md
  # Diataxis layout (#772): sections group pages by purpose; files stay where they are so URLs don't change.
  - Get started:
    - get-started/index.md
    - Setup: get-started/install_setup.md
    - Run in a container: get-started/container.md
  - Tutorials:
    - tool-usage/index.md
    - End-to-end workflows:
      - Object Detection Workflow via API: get-started/checkmaite_api_od.ipynb
      - Image Classification Workflow via API: get-started/checkmaite_api_ic.ipynb
    - Dataset evaluation:
      - Dataeval - Bias: tool-usage/dataeval_bias_tutorial.ipynb
      - Dataeval - Feasibility: tool-usage/dataeval_feasibility_tutorial.ipynb
      - Dataeval - Linting: tool-usage/dataeval_linting_tutorial.ipynb
      - Dataeval - Shift: tool-usage/dataeval_shift_tutorial.ipynb
    - Model evaluation:
      - MAITE Evaluation: tool-usage/maite_evaluation_tutorial.ipynb
      - NRTK: tool-usage/nrtk_tutorial.ipynb
      - XAITK: tool-usage/xaitk_tutorial.ipynb
    - Results & analysis:
      - Analytics Store: tool-usage/analytics_store_tutorial.ipynb
    - Job submission:
      - Ray Simple Job Submission: tool-usage/ray_simple_job_submission_tutorial.ipynb
      - Ray Job Submission: tool-usage/ray_job_submission_tutorial.ipynb
  - How-to guides:
    - how-to/index.md
    - Save & query results: get-started/saving_querying_results.md
    - Run remote inference with Ray Serve: get-started/checkmaite_ray_serve.ipynb
    - Wrap an ONNX object detection model: tool-usage/onnx_object_detection_wrapper.ipynb
  - Explanations:
    - explanations/index.md
    - Saliency and explainability: explanations/saliency.md
    - "Distribution shift: drift and OOD detection": explanations/distribution_shift.md
    - "Key concepts: capabilities, runs, and caches": development/key_concepts.md
    - Job submission overview: development/job_submission/index.md
    - Job protocol and lifecycle: development/job_submission/protocol.md
    - Ray job backend: development/job_submission/ray_job_backend.md
    - Ray simple job backend: development/job_submission/ray_simple_job_backend.md
    - Worker environments: development/job_submission/worker_environments.md
    - Kubernetes and KubeRay: development/job_submission/kubernetes.md
    - Analytics store in distributed execution: development/job_submission/analytics_store.md
  - Reference:
    - reference/index.md
    - Glossary: reference/glossary.md
    - Batch container: reference/container.md
    - System requirements: reference/system_requirements.md
    - Conventions: reference/conventions.md
    - Job backend configuration: development/job_submission/configure_job_backend.md
    - ONNX model wrappers: development/onnx_model_wrappers.md
    - Personas: reference/personas.md
    - Workflows: reference/workflows.md
  - CheckMAITE development:
    - development/index.md
    - Development setup: development/dev_setup.md
    - Development strategy: development/dev_strategy.md
    - Container maintenance: development/container_maintenance.md
    - Analytics store guide: development/analytics_store_guide.ipynb
    - Plugin system: development/plugins.md
    - Releasing: RELEASING.md
    - Contributing: development/contributing.md
markdown_extensions:
  - admonition  # enables callout boxes
  - attr_list
  - md_in_html
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.snippets:
      check_paths: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.superfences:  # enables mermaid diagrams in markdown
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

plugins:
  - mkdocs-jupyter:
      execute: true
      execute_ignore:
        - "**/checkmaite_ray_serve.ipynb"
        - "**/ray_job_submission_tutorial.ipynb"
      kernel_name: python3
      allow_errors: false
  - search

exclude_docs: |
  reference/examples
  get-started/temp_yolo_dataset
  get-started/tscache
  tool-usage/report
  *_Report.md
