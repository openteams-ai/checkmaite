# Throwaway smoke test for the create-gitlab-release job. DO NOT MERGE.
workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == 'merge_request_event'

release-job-smoke-test:
  image:
    name: registry.gitlab.com/gitlab-org/cli:v1.120.0
    entrypoint: [""]
  variables:
    GIT_DEPTH: "0"
    GLAB_ENABLE_CI_AUTOLOGIN: "true"
    TEST_TAG: 0.0.0-ci-release-test
  script:
    - apk add --no-cache curl git jq
    - git fetch --force origin "+refs/tags/*:refs/tags/*"
    - git describe --tags --abbrev=0 "$TEST_TAG^"
    - curl -fsSL https://pypi.org/pypi/checkmaite/0.4.0/json | jq -er '.urls[] | select(.packagetype == "bdist_wheel") | .url'
    - |
      glab release create "$TEST_TAG" -R "$CI_PROJECT_PATH" --name "$TEST_TAG" \
        --notes "CI smoke test for create-gitlab-release; safe to delete." \
        --assets-links '[{"name": "test wheel", "url": "https://pypi.org/project/checkmaite/0.4.0/#files", "link_type": "package"}, {"name": "test PyPI page", "url": "https://pypi.org/project/checkmaite/0.4.0/", "link_type": "package"}]'
    - glab release view "$TEST_TAG" -R "$CI_PROJECT_PATH"
  after_script:
    - glab release delete "$TEST_TAG" -R "$CI_PROJECT_PATH" --yes || true
