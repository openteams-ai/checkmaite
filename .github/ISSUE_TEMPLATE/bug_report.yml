name: Bug report
description: Report a bug in CheckMAITE. Do not use this for security vulnerabilities; see SECURITY.md.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug. Do **not** report security vulnerabilities here: follow [SECURITY.md](https://github.com/openteams-ai/checkmaite/blob/main/SECURITY.md) instead.
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: A clear and descriptive one-line summary of the bug.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      description: The exact steps (before and during) which led to the bug. Include the dataset, model, and capability used, and a minimal script if possible.
      value: |
        1.
        2.
        3.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior
      description: Include the full call stack and error message when possible.
    validations:
      required: true
  - type: dropdown
    id: frequency
    attributes:
      label: Frequency of Behavior
      options:
        - Always
        - Intermittently
        - Once
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      value: |
        - CheckMAITE version:
        - Python version:
        - OS:
        - CPU or GPU (and CUDA version if GPU):
        - Install method (uv, pip, or conda):
    validations:
      required: true
  - type: textarea
    id: resources
    attributes:
      label: Resources or other relevant info
      description: Link other issues, pull requests, or code that might be helpful.
