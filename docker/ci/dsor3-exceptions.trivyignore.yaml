# DSOR-3 exceptions for the release vulnerability gate (scan_container.sh).
#
# Container scans fail on any High or Critical finding. An entry here
# removes one finding from that gate only; the retained JSON, GitLab, and Cosign
# vulnerability reports stay unfiltered. Releases rebuild from the release tag,
# so an exception must be committed before the tag is created.
#
# Every entry needs `purls`, a `statement` and an `expired_at` date; expired
# entries no longer suppress the finding. `purls` limits the entry to that CVE in
# that package. The statement must start with either "Approved exception
# jatic/internal-docs#<number>" or "Accepted at Maturity S"; the release scan
# rejects anything else. DSOR-3 is required from JATIC Maturity I; checkmaite
# targets Maturity S, so these findings are accepted without an exception for
# now. Before a Maturity I release, raise them as exception requests and drop
# "Accepted at Maturity S" from the allowed statements in scan_container.sh.
#
# Unfixed Ubuntu 24.04 findings (no fixed package at UBUNTU_SNAPSHOT
# 20261002T000000Z), present in both the CPU and CUDA images.
vulnerabilities:
  - id: CVE-2025-66382
    purls:
      - pkg:deb/ubuntu/libexpat1
    statement: "Accepted at Maturity S (DSOR-3 not required): libexpat1, no Ubuntu fix"
    expired_at: 2027-01-05
