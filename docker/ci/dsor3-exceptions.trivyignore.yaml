# DSOR-3 exceptions for the Trivy release vulnerability gate (scan_container.sh).
#
# Container scans fail on any Trivy High or Critical finding; Medium findings
# (DSOR-3-H-2) also fail them when CHECKMAITE_STRICT_SCAN_GATES=true. An entry
# here removes one finding from the Trivy gates only; the retained JSON, GitLab,
# and Cosign vulnerability reports stay unfiltered, and the Grype gate applies no
# exceptions. Releases rebuild from the release tag, so an exception
# must be committed before the tag is created.
#
# Every entry needs `purls`, a `statement` and an `expired_at` date; expired
# entries no longer suppress the finding. `purls` limits the entry to that CVE in
# that package. The statement must start with "Approved exception
# jatic/internal-docs#<number>"; the release scan rejects anything else.
vulnerabilities: []
